# Configuration de la camera
camera:
{
resolution = { width = 1920; height = 1080; };
position = { x = 0.0; y = -100.0; z = -1000.0; };
rotation = { x = 0.0; y = 0.0; z = 0.0; };
fov = 110.0; # In degree
};

# objects in the scene
