{ x = -100.0; y = -95.0; z = 50.0; r = 20.0; color = { r = 0; g = 255; b = 64; }; },
{ x = 40.0; y = -100.0; z = 10.0; r = 30.0; color = { r = 255; g = 0; b = 64; }; }
);
};

# Light configuration
